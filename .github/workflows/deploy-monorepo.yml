name: Deploy GojiTrip (Frontend & Backend) to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Build Frontend
        working-directory: ./reactgojitrip-frontend-react-
        env:
          VITE_API_BASE_URL: https://gojiback.gyaneshindustries.com/api/v1
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📦 Build Backend
        working-directory: ./gojitripBackNode-Backend/gojitripBackNode-Backend
        run: |
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build

      - name: 🌐 Deploy Frontend & Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            echo "====== 🚀 EXECUTING AUTOMATED HOSTINGER DEPLOYMENT ======"

            REPO_DIR="/home/${{ secrets.HOSTINGER_SSH_USER }}/gojitrip_repo"
            FRONTEND_PUB="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/gojifront.gyaneshindustries.com/public_html"
            BACKEND_PUB="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/gojiback.gyaneshindustries.com/public_html"

            # 1. Pull Latest Code into REPO_DIR
            mkdir -p $REPO_DIR
            cd $REPO_DIR
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
            else
              git clone https://github.com/khans61101-dotcom/GojiTrip.git .
            fi

            # 2. Build & Deploy Frontend to gojifront
            echo "Deploying Frontend to $FRONTEND_PUB..."
            if [ -d "reactgojitrip-frontend-react-" ]; then
              cd reactgojitrip-frontend-react-
              npm install --legacy-peer-deps
              npm run build
              mkdir -p $FRONTEND_PUB
              rm -rf $FRONTEND_PUB/*
              cp -r dist/* $FRONTEND_PUB/
              cd $REPO_DIR
            fi

            # 3. Build & Deploy Backend to gojiback
            echo "Deploying Backend to $BACKEND_PUB..."
            mkdir -p $BACKEND_PUB
            if [ -d "gojitripBackNode-Backend/gojitripBackNode-Backend" ]; then
              rsync -av --exclude='node_modules' gojitripBackNode-Backend/gojitripBackNode-Backend/ $BACKEND_PUB/ || cp -r gojitripBackNode-Backend/gojitripBackNode-Backend/* $BACKEND_PUB/
              cd $BACKEND_PUB
              npm install --legacy-peer-deps
              npx prisma generate
              npm run build
              echo "Restarting Node.js Backend Server..."
              pm2 restart all || touch tmp/restart.txt
            fi

            echo "====== ✅ HOSTINGER FRONTEND & BACKEND DEPLOYED SUCCESSFULLY ======"
