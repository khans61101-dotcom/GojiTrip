name: Deploy GojiTrip (Frontend & Backend) to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: reactgojitrip-frontend-react-/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./reactgojitrip-frontend-react-
        run: npm ci

      - name: 🏗️ Build Frontend Bundle
        working-directory: ./reactgojitrip-frontend-react-
        env:
          VITE_API_BASE_URL: https://gojiback.gyaneshindustries.com/api/v1
        run: npm run build

      - name: 📦 Install Backend Dependencies & Prisma Generate
        working-directory: ./gojitripBackNode-Backend/gojitripBackNode-Backend
        run: |
          npm ci
          npx prisma generate

      - name: 🏗️ Build NestJS Backend
        working-directory: ./gojitripBackNode-Backend/gojitripBackNode-Backend
        run: npm run build

  deploy-to-hostinger:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger Hostinger Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            echo "====== 🌐 STARTING HOSTINGER AUTO-DEPLOYMENT ======"
            
            # 1. Update Repository Code
            cd /home/${{ secrets.HOSTINGER_SSH_USER }}/domains/gojiback.gyaneshindustries.com/public_html || true
            if [ -d ".git" ]; then
              git pull origin main || git pull origin master
            fi

            # 2. Deploy Backend
            if [ -d "gojitripBackNode-Backend/gojitripBackNode-Backend" ]; then
              cd gojitripBackNode-Backend/gojitripBackNode-Backend
              npm install --production=false
              npx prisma generate
              npm run build
              pm2 restart all || touch tmp/restart.txt
            fi

            echo "====== ✅ HOSTINGER AUTO-DEPLOYMENT COMPLETED SUCCESSFULLY ======"
