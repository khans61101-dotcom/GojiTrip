name: Deploy GojiTrip (Frontend & Backend) to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Build Frontend
        working-directory: ./reactgojitrip-frontend-react-
        env:
          VITE_API_BASE_URL: https://gojiback.gyaneshindustries.com/api/v1
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📦 Build Backend
        working-directory: ./gojitripBackNode-Backend/gojitripBackNode-Backend
        run: |
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build

      - name: 🌐 Deploy Frontend & Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            echo "====== 🚀 EXECUTING AUTOMATED HOSTINGER DEPLOYMENT ======"

            BACKEND_PATH="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/gojiback.gyaneshindustries.com/public_html"

            echo "Updating Backend at $BACKEND_PATH..."
            mkdir -p $BACKEND_PATH
            cd $BACKEND_PATH
            if [ -d ".git" ]; then
              git pull origin main || git pull origin master
            else
              git clone https://github.com/khans61101-dotcom/GojiTrip.git . || true
            fi

            if [ -d "gojitripBackNode-Backend/gojitripBackNode-Backend" ]; then
              cd gojitripBackNode-Backend/gojitripBackNode-Backend
              npm install --legacy-peer-deps
              npx prisma generate
              npm run build
              echo "Restarting Node.js Backend..."
              pm2 restart all || touch tmp/restart.txt
            fi

            echo "====== ✅ DEPLOYMENT COMPLETED SUCCESSFULLY ======"
