name: Deploy GojiTrip (Frontend & Backend) to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Build Frontend
        working-directory: ./reactgojitrip-frontend-react-
        env:
          VITE_API_BASE_URL: https://gojiback.gyaneshindustries.com/api/v1
        run: |
          npm ci
          npm run build

      - name: 📦 Build Backend
        working-directory: ./gojitripBackNode-Backend/gojitripBackNode-Backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: 🌐 Deploy via SSH to Hostinger
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            echo "====== HOSTINGER DEPLOYMENT STARTED ======"
            pwd
            ls -la
            echo "====== HOSTINGER DEPLOYMENT SUCCESS ======"
