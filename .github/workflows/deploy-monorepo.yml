name: Deploy GojiTrip (Frontend & Backend) to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: reactgojitrip-frontend-react-/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./reactgojitrip-frontend-react-
        run: npm ci

      - name: 🏗️ Build Frontend Production Bundle
        working-directory: ./reactgojitrip-frontend-react-
        env:
          VITE_API_BASE_URL: https://gojiback.gyaneshindustries.com/api/v1
        run: npm run build

      - name: 📂 Deploy Frontend to Hostinger via FTP
        uses: SamKirland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./reactgojitrip-frontend-react-/dist/
          server-dir: /public_html/

  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gojitripBackNode-Backend/gojitripBackNode-Backend/package-lock.json

      - name: 📦 Install Backend Dependencies & Prisma Generate
        working-directory: ./gojitripBackNode-Backend/gojitripBackNode-Backend
        run: |
          npm ci
          npx prisma generate

      - name: 🏗️ Build NestJS Backend
        working-directory: ./gojitripBackNode-Backend/gojitripBackNode-Backend
        run: npm run build
