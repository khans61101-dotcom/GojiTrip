name: Deploy GojiTrip (Frontend & Backend) to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Build Frontend Bundle
        working-directory: ./reactgojitrip-frontend-react-
        env:
          VITE_API_BASE_URL: https://gojiback.gyaneshindustries.com/api/v1
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📦 Build Backend Bundle
        working-directory: ./gojitripBackNode-Backend/gojitripBackNode-Backend
        run: |
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build

      - name: 📂 Deploy Frontend Dist to Hostinger via FTP (Port 21)
        uses: SamKirland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 21
          local-dir: ./reactgojitrip-frontend-react-/dist/
          server-dir: /domains/gojifront.gyaneshindustries.com/public_html/

      - name: 🌐 Update Backend Server via SSH (Port 65002)
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            echo "====== 🚀 RESTARTING BACKEND SERVER ======"
            BACKEND_PUB="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/gojiback.gyaneshindustries.com/public_html"
            if [ -d "$BACKEND_PUB" ]; then
              cd $BACKEND_PUB
              pm2 restart all || touch tmp/restart.txt
            fi
            echo "====== ✅ BACKEND SERVER READY ======"
