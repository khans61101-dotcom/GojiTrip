name: Deploy GojiTrip (Frontend & Backend) to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Build Frontend
        working-directory: ./reactgojitrip-frontend-react-
        env:
          VITE_API_BASE_URL: https://gojiback.gyaneshindustries.com/api/v1
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📦 Build Backend
        working-directory: ./gojitripBackNode-Backend/gojitripBackNode-Backend
        run: |
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build

      - name: 📂 Upload Frontend Dist via Native SCP
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.HOSTINGER_SSH_PASSWORD }}" scp -P ${{ secrets.HOSTINGER_SSH_PORT }} -o StrictHostKeyChecking=no -r ./reactgojitrip-frontend-react-/dist/* ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/gojifront.gyaneshindustries.com/public_html/

      - name: 🌐 Update Backend & Permissions via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            echo "====== 🚀 FIXING PERMISSIONS & UPDATING BACKEND ======"
            FRONTEND_PUB="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/gojifront.gyaneshindustries.com/public_html"
            chmod -R 755 $FRONTEND_PUB || true
            chmod 644 $FRONTEND_PUB/index.html || true

            BACKEND_PUB="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/gojiback.gyaneshindustries.com/public_html"
            if [ -d "$BACKEND_PUB" ]; then
              cd $BACKEND_PUB
              pm2 restart all || touch tmp/restart.txt
            fi
            echo "====== ✅ DEPLOYMENT COMPLETED ======"
